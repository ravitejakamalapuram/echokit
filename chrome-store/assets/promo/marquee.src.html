<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1400px; height: 560px;
    background: #0a0a0b;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .frame {
    position: relative;
    width: 1400px; height: 560px;
    background:
      radial-gradient(ellipse 900px 500px at 78% 50%, rgba(251,191,36,0.08), transparent 60%),
      #0a0a0b;
    display: flex; align-items: center;
  }
  .left { width: 56%; padding: 0 0 0 72px; }
  .right { width: 44%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .badge {
    width: 40px; height: 40px; border-radius: 10px;
    background: #fbbf24;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-weight: 800; font-size: 15px; color: #18181b;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-weight: 700; font-size: 15px; color: #fbbf24; letter-spacing: 3px;
  }
  .headline {
    font-size: 52px; line-height: 1.14; font-weight: 700; color: #fafafa;
    letter-spacing: -0.5px; max-width: 620px;
  }
  .headline em { color: #fbbf24; font-style: normal; }
  .sub {
    margin-top: 22px; font-size: 21px; color: #a1a1aa; font-weight: 500; max-width: 560px;
  }
  .chips { display: flex; gap: 12px; margin-top: 36px; }
  .chip {
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    padding: 9px 16px; border-radius: 8px;
    border: 1px solid rgba(251,191,36,0.35); color: #fcd34d; background: rgba(251,191,36,0.08);
  }

  .panel-card {
    width: 480px; height: 480px;
    border-radius: 16px;
    background: #0f0f11;
    border: 1px solid rgba(251,191,36,0.45);
    box-shadow: 0 0 60px rgba(251,191,36,0.18), 0 20px 50px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }
  .panel-shot {
    width: 100%; height: 100%;
    background-image: url('file:///Users/rkamalapuram/.paperclip/worktrees/echokit/agent/POR-89-marketing-aso-pass-on-the-echokit-chrome-web-store-listing/store/screenshots/cap-01-record-mock-loop.png');
    background-repeat: no-repeat;
    background-position: -700px -80px;
    background-size: 1280px 800px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="left">
      <div class="brand">
        <div class="badge">EK</div>
        <div class="eyebrow">ECHOKIT — CHROME EXTENSION</div>
      </div>
      <div class="headline">Intercept fetch calls.<br>Mock the <em>API</em> instantly.</div>
      <div class="sub">Record real traffic once. Replay it as a mock. No backend needed.</div>
      <div class="chips">
        <div class="chip">FETCH</div>
        <div class="chip">XHR</div>
        <div class="chip">GRAPHQL</div>
        <div class="chip">WS</div>
      </div>
    </div>
    <div class="right">
      <div class="panel-card">
        <div class="panel-shot"></div>
      </div>
    </div>
  </div>
</body>
</html>
