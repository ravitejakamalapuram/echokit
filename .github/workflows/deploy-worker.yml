name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      
      - name: Verify deployment
        if: success()
        run: |
          echo "✅ Worker deployed successfully!"
          echo "🔗 Production URL: https://api.echo-kit.com"
          echo "🔗 Workers URL: https://echokit-license.echokit-rk.workers.dev"
          echo ""
          echo "Testing health endpoint..."
          sleep 5  # Wait for propagation
          curl -f https://api.echo-kit.com/__health || echo "⚠️ Custom domain not ready yet (DNS propagation)"
          curl -f https://echokit-license.echokit-rk.workers.dev/__health && echo "✅ Workers.dev URL working!"
