name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-ci.yml@v1.1.4
    with:
      extension-dir: 'extension'
      run-lint: true
      run-unit-tests: true
      run-e2e-tests: true
      e2e-test-script: 'tests/smoke_echokit.py'
