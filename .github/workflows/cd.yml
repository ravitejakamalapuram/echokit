name: Continuous Delivery

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '!extension/**/*.md'
      - 'website/**'
      - 'worker/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      release_bump:
        description: 'Version bump type (overrides commit-message detection for extension release)'
        required: false
        default: 'none'
        type: choice
        options: [none, patch, minor, major]
      deploy_target:
        description: 'Which infrastructure target to deploy'
        required: false
        default: 'none'
        type: choice
        options: [none, all, website, worker]

# Never cancel CD runs mid-flight — half-completed deployments or version tags are bad state.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Detect Changed Paths ───────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.manual-dispatch.outputs.website || steps.changes.outputs.website }}
      worker: ${{ steps.manual-dispatch.outputs.worker || steps.changes.outputs.worker }}
      extension: ${{ steps.manual-dispatch.outputs.extension || steps.changes.outputs.extension }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Handle manual workflow dispatch
      - name: Handle manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: manual-dispatch
        run: |
          RELEASE_BUMP="${{ inputs.release_bump }}"
          DEPLOY_TARGET="${{ inputs.deploy_target }}"

          echo "🖱️ Manual dispatch:"
          echo "  release_bump: ${RELEASE_BUMP}"
          echo "  deploy_target: ${DEPLOY_TARGET}"

          # Extension release
          if [[ "$RELEASE_BUMP" != "none" ]]; then
            echo "extension=true" >> $GITHUB_OUTPUT
          else
            echo "extension=false" >> $GITHUB_OUTPUT
          fi

          # Deployment targets
          if [[ "$DEPLOY_TARGET" == "all" || "$DEPLOY_TARGET" == "website" ]]; then
            echo "website=true" >> $GITHUB_OUTPUT
          else
            echo "website=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$DEPLOY_TARGET" == "all" || "$DEPLOY_TARGET" == "worker" ]]; then
            echo "worker=true" >> $GITHUB_OUTPUT
          else
            echo "worker=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Automatic change detection on push
      - name: Detect changed paths
        if: github.event_name != 'workflow_dispatch'
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Website changes
          if echo "$CHANGED" | grep -q '^website/'; then
            echo "website=true" >> $GITHUB_OUTPUT
            echo "🌐 website/ changes detected"
          else
            echo "website=false" >> $GITHUB_OUTPUT
          fi

          # Worker changes (including workflow changes)
          if echo "$CHANGED" | grep -qE '^(worker/|\.github/workflows/cd\.yml)'; then
            echo "worker=true" >> $GITHUB_OUTPUT
            echo "⚙️ worker/ changes detected"
          else
            echo "worker=false" >> $GITHUB_OUTPUT
          fi

          # Extension changes (excluding markdown files)
          if echo "$CHANGED" | grep '^extension/' | grep -qv '\.md$'; then
            echo "extension=true" >> $GITHUB_OUTPUT
            echo "📦 extension/ changes detected"
          else
            echo "extension=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  # ── Deploy Website ─────────────────────────────────────────────────────────────
  deploy-website:
    name: Deploy website → Cloudflare Pages
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/cloudflare-pages-deploy.yml@main
    with:
      project-name: 'echokit-website'
      directory: 'website'
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy Worker ──────────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy worker → Cloudflare Workers
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true'
    permissions:
      contents: read
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/cloudflare-worker-deploy.yml@main
    with:
      working-directory: 'worker'
      health-check-url: 'https://api.echo-kit.com/__health'
      health-check-timeout: 10
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy & Publish Chrome Extension ──────────────────────────────────────────
  # Note: This may fail with ITEM_NOT_UPDATABLE if a version is under review.
  # This is expected behavior and not a CI/CD issue. The workflow will succeed
  # once the Chrome Web Store review completes (typically 1-2 days).
  # TODO: Update the shared workflow to handle ITEM_NOT_UPDATABLE gracefully
  publish-extension:
    name: Package & Publish Extension
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true'
    permissions:
      contents: write
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-cd.yml@main
    with:
      extension-dir: 'extension'
      publish-target: 'default'
      auto-publish: 'true'
    secrets:
      chrome-extension-id: ${{ secrets.CWS_EXTENSION_ID }}
      chrome-client-id: ${{ secrets.CWS_CLIENT_ID }}
      chrome-client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      chrome-refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
