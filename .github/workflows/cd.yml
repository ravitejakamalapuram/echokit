name: Continuous Delivery

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '!extension/**/*.md'
      - 'website/**'
      - 'worker/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:
    inputs:
      release_bump:
        description: 'Version bump type (overrides commit-message detection for extension release)'
        required: false
        default: 'none'
        type: choice
        options: [none, patch, minor, major]
      deploy_target:
        description: 'Which infrastructure target to deploy'
        required: false
        default: 'none'
        type: choice
        options: [none, all, website, worker]

# Never cancel CD runs mid-flight — half-completed deployments or version tags are bad state.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Detect Changed Paths ───────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed targets
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.changes.outputs.website }}
      worker:  ${{ steps.changes.outputs.worker }}
      extension: ${{ steps.changes.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed targets
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_BUMP="${{ inputs.release_bump }}"
            DEPLOY_TARGET="${{ inputs.deploy_target }}"

            echo "🖱️ Manual dispatch:"
            echo "  release_bump: ${RELEASE_BUMP}"
            echo "  deploy_target: ${DEPLOY_TARGET}"

            if [[ "$RELEASE_BUMP" != "none" ]]; then
              echo "extension=true" >> $GITHUB_OUTPUT
            else
              echo "extension=false" >> $GITHUB_OUTPUT
            fi

            if [[ "$DEPLOY_TARGET" == "all" || "$DEPLOY_TARGET" == "website" ]]; then
              echo "website=true" >> $GITHUB_OUTPUT
            else
              echo "website=false" >> $GITHUB_OUTPUT
            fi

            if [[ "$DEPLOY_TARGET" == "all" || "$DEPLOY_TARGET" == "worker" ]]; then
              echo "worker=true" >> $GITHUB_OUTPUT
            else
              echo "worker=false" >> $GITHUB_OUTPUT
            fi
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -q '^website/'; then
              echo "website=true" >> $GITHUB_OUTPUT
              echo "🌐 website/ changes detected"
            else
              echo "website=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED" | grep -qE '^(worker/|\.github/workflows/cd\.yml)'; then
              echo "worker=true" >> $GITHUB_OUTPUT
              echo "⚙️ worker/ changes detected"
            else
              echo "worker=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED" | grep '^extension/' | grep -qv '\.md$'; then
              echo "extension=true" >> $GITHUB_OUTPUT
              echo "📦 extension/ changes detected"
            else
              echo "extension=false" >> $GITHUB_OUTPUT
            fi
          fi

  # ── Deploy Website ─────────────────────────────────────────────────────────────
  deploy-website:
    name: Deploy website → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required website files exist
        run: |
          set -e
          test -f website/index.html
          test -f website/style.css
          echo "✅ Website files validated"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: echokit-website
          directory:   website
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy Worker ──────────────────────────────────────────────────────────────
  deploy-worker:
    name: Deploy worker → Cloudflare Workers
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command:          deploy

      - name: Verify deployment health endpoints
        run: |
          set -e
          echo "⏳ Waiting 5 seconds for propagation..."
          sleep 5

          echo "Testing Workers.dev URL..."
          if ! curl -f --connect-timeout 5 --max-time 10 https://echokit-license.echokit-rk.workers.dev/__health; then
            echo "❌ Workers.dev URL health check failed"
            exit 1
          fi
          echo "✅ Workers.dev URL is healthy"

          echo "Testing custom domain..."
          if ! curl -f --connect-timeout 5 --max-time 10 https://api.echo-kit.com/__health; then
            echo "❌ Custom domain health check failed"
            exit 1
          fi
          echo "✅ Custom domain is healthy"

  # ── Deploy & Publish Chrome Extension ──────────────────────────────────────────
  publish-extension:
    name: Package & Publish Extension
    needs: detect-changes
    if: needs.detect-changes.outputs.extension == 'true'
    permissions:
      contents: write
    uses: ravitejakamalapuram/.github-workflows-shared/.github/workflows/chrome-extension-cd.yml@v1.1.9
    with:
      extension-dir: 'extension'
      publish-target: 'default'
      auto-publish: 'true'
    secrets:
      chrome-extension-id: ${{ secrets.CWS_EXTENSION_ID }}
      chrome-client-id: ${{ secrets.CWS_CLIENT_ID }}
      chrome-client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      chrome-refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
