name: Test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Smoke tests now run in headless mode using Playwright's chromium channel
  # This enables Chrome extension testing in CI without requiring a display server
  # Tests can be run locally in headed mode with: HEADLESS=false python3 tests/smoke_echokit.py

  smoke:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and dependencies
        run: |
          pip install playwright websockets
          python -m playwright install chromium

      - name: Run smoke tests (headless)
        run: python3 tests/smoke_echokit.py
        env:
          HEADLESS: 'true'

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/
            screenshots/
            /tmp/*.png
          retention-days: 7
          if-no-files-found: ignore

  # Basic validation job that always runs - verifies repo structure
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension structure
        run: |
          echo "✓ Checking extension files exist..."
          test -f extension/manifest.json
          test -f extension/background.js
          test -f extension/injected.js
          test -f extension/shared/app.js
          echo "✓ All required files present"

      - name: Validate manifest.json syntax
        run: |
          echo "✓ Checking manifest.json is valid JSON..."
          python3 -m json.tool extension/manifest.json > /dev/null
          echo "✓ manifest.json is valid"

      - name: Check JavaScript syntax
        run: |
          echo "✓ Checking JavaScript files for syntax errors..."
          node -c extension/background.js
          node -c extension/injected.js
          node -c extension/shared/app.js
          node -c extension/content.js
          echo "✓ All JavaScript files have valid syntax"
