name: Test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Note: Extension smoke tests are currently skipped in CI due to a known
  # Chromium limitation: extension service workers don't register reliably
  # in headless mode (even with --headless=new). See Issue #4 for details.
  #
  # Tests work perfectly when run locally:
  #   python3 tests/smoke_echokit.py
  #
  # This job is kept for documentation and can be re-enabled when/if the
  # Chromium limitation is resolved, or when we migrate to unit tests that
  # don't require a full browser environment.

  smoke:
    runs-on: ubuntu-latest
    # Skip extension tests in CI - they require non-headless browser
    # Run them locally before merging: python3 tests/smoke_echokit.py
    if: false  # TODO: Re-enable when headless extension support improves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install Playwright + xvfb + DBus
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11

      - name: Setup DBus session
        run: |
          # Start a DBus session to prevent DBus errors in headless browser
          mkdir -p ~/.dbus-session
          dbus-launch --sh-syntax > ~/.dbus-session/dbus-env
          cat ~/.dbus-session/dbus-env

      - name: Run smoke test
        run: |
          # Source DBus environment
          if [ -f ~/.dbus-session/dbus-env ]; then
            . ~/.dbus-session/dbus-env
          fi
          # Run with xvfb (virtual display)
          xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/smoke_echokit.py
        env:
          # Prevent DBus warnings
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1001/bus

  # Basic validation job that always runs - verifies repo structure
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension structure
        run: |
          echo "✓ Checking extension files exist..."
          test -f extension/manifest.json
          test -f extension/background.js
          test -f extension/injected.js
          test -f extension/shared/app.js
          echo "✓ All required files present"

      - name: Validate manifest.json syntax
        run: |
          echo "✓ Checking manifest.json is valid JSON..."
          python3 -m json.tool extension/manifest.json > /dev/null
          echo "✓ manifest.json is valid"

      - name: Check JavaScript syntax
        run: |
          echo "✓ Checking JavaScript files for syntax errors..."
          node -c extension/background.js
          node -c extension/injected.js
          node -c extension/shared/app.js
          node -c extension/content.js
          echo "✓ All JavaScript files have valid syntax"
