# EchoKit license-validation Cloudflare Worker
#
# Deploy:
#   cd /app/worker
#   npm i -g wrangler
#   wrangler login
#   wrangler secret put ECHOKIT_HMAC_SECRET   # paste a 256-bit hex string (legacy EK-* keys)
#   wrangler deploy

name = "echokit-license"
main = "worker.js"
compatibility_date = "2025-01-01"

# The Worker is publicly callable. Gumroad license keys are checked against
# Gumroad's license API; legacy EK-* keys are verified with the HMAC signature
# baked into each key (ECHOKIT_HMAC_SECRET), so no database is needed.
[vars]
ECHOKIT_PUBLIC_NAME = "EchoKit License API"

# Remote paywall switch, served at GET /v1/config (see docs/PAYWALL_SWITCH.md).
# Changing these and redeploying the worker turns paid Pro on/off for every
# installed extension without a Chrome Web Store release.
PAYWALL_ENABLED = "true"           # Paid Pro is live (Gumroad).
GRANDFATHER_UNTIL = "2026-12-31T00:00:00Z"  # Early adopters keep Pro free until then.
CHECKOUT_URL_MONTHLY = "https://raviteja852.gumroad.com/l/echokit-pro?recurrence=monthly"
CHECKOUT_URL_ANNUAL = "https://raviteja852.gumroad.com/l/echokit-pro?recurrence=yearly"
CHECKOUT_URL_LIFETIME = "https://raviteja852.gumroad.com/l/echokit-lifetime"

# Gumroad products whose license keys unlock Pro (public ids, not secrets).
# Format: JSON {"<product_id>": PLAN} or "<product_id>:PLAN,<product_id>:PLAN".
# PLAN = MEMBERSHIP (PRO or YEAR from the purchase recurrence) | PRO | YEAR | LTD.
#   21jW8YdWBWjVy8EmcKEgMQ==  "EchoKit Pro" membership ($5/month, $49/year)
#   nPgt8NsB8fkhPFtt61SR8w==  "EchoKit Pro Lifetime" ($199 one-time)
GUMROAD_PRODUCT_IDS = '{"21jW8YdWBWjVy8EmcKEgMQ==":"MEMBERSHIP","nPgt8NsB8fkhPFtt61SR8w==":"LTD"}'

# Custom domain routing is configured in Cloudflare Dashboard
# Route: api.echo-kit.com/* -> Zone: echo-kit.com
# The worker is accessible at both api.echo-kit.com and the workers.dev URL
# Removing routes from wrangler.toml since it's managed in the dashboard
